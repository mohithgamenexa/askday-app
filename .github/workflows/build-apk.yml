# Builds the native Android APK on GitHub's servers whenever anything in android/ changes.
# Download it from the "Actions" tab: open the latest run, then "askday-apk".
name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: # also lets you start a build by hand from the Actions tab

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle downloads so later builds are faster
      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew runnable
        run: chmod +x gradlew

      - name: Build the APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: askday-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
