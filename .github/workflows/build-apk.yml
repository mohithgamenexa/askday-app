# Builds the Android APK on GitHub's servers every time you upload changes.
# Download it from the "Actions" tab: open the latest run, then "askday-apk".
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: # also lets you start a build by hand from the Actions tab

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install packages
        run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: askday-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
